<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Documentary Synthesis Discussion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#f8f7f4;color:#1a1a1a;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:4rem;
}
header{text-align:center;padding:1.25rem 1rem .75rem;border-bottom:1px solid #e0ddd5}
header h1{font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
header p{font-size:.82rem;color:#777;margin-top:.15rem}

/* Graph */
.graph-wrap{display:flex;flex-direction:column;align-items:center;padding:.75rem .5rem .25rem}
.film-graph{width:100%;max-width:420px;touch-action:manipulation}
.node{cursor:pointer}
.node circle.bg{fill:transparent;stroke:transparent}
.node circle.vis{stroke-width:2.5;fill:#f8f7f4;transition:fill .2s,stroke .2s}
.node.selected circle.vis{fill:var(--c);stroke:var(--c)}
.node text.label{font-size:11px;text-anchor:middle;fill:#555;font-weight:600;pointer-events:none;transition:fill .2s}
.node.selected text.label{fill:#fff}
.node text.name{font-size:10px;text-anchor:middle;fill:#444;font-weight:500;pointer-events:none}
.edge{stroke:#d8d4cc;stroke-width:1.5;opacity:0;transition:opacity .3s,stroke .25s}
.edge.active{opacity:1;stroke:#888;stroke-width:2.5}
.sel-status{font-size:.8rem;color:#888;margin-top:.25rem;min-height:1.2em;text-align:center}
.clear-btn{
  margin-top:.35rem;padding:.3rem .9rem;font-size:.75rem;
  background:transparent;border:1px solid #ccc;border-radius:4px;color:#777;cursor:pointer;
  display:none;
}
.clear-btn.show{display:inline-block}

/* Phase steps */
.phase-bar{
  display:flex;justify-content:center;gap:.25rem;padding:.5rem 1rem;
  max-width:480px;margin:0 auto;
}
.phase-step{
  font-size:.7rem;font-weight:600;padding:.25rem .6rem;border-radius:12px;
  background:#eae7e0;color:#999;transition:background .25s,color .25s;
}
.phase-step.active{background:#3d5a80;color:#fff}

/* Content */
.content-area{padding:.5rem 1rem 1rem;max-width:640px;margin:0 auto}
.card{
  background:#fff;border-radius:8px;padding:1.15rem 1.1rem;margin-bottom:.85rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid var(--accent,#ccc);
  animation:fadeUp .3s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card h3{font-size:.95rem;margin-bottom:.4rem;line-height:1.3}
.card .theme{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:#888;margin-bottom:.35rem}
.card p,.card li{font-size:.88rem;color:#333;line-height:1.55}
.card ul{list-style:none;padding:0}
.card ul li{padding:.4rem 0;border-bottom:1px solid #f0ede6}
.card ul li:last-child{border:none}
.card ul li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent,#ccc);margin-right:.5rem;vertical-align:middle}
blockquote{
  border-left:3px solid #d0cbc0;padding:.4rem 0 .4rem .85rem;margin:.65rem 0;
  font-style:italic;color:#555;font-size:.84rem;
}
blockquote .attr{display:block;font-style:normal;font-weight:600;margin-top:.15rem;font-size:.78rem;color:#666}
.readings{margin-top:.7rem;padding-top:.5rem;border-top:1px solid #f0ede6}
.readings h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;color:#999;margin-bottom:.3rem}
.readings p{font-size:.8rem;color:#666;line-height:1.5}
.synopsis{font-size:.84rem;color:#555;margin-bottom:.5rem;line-height:1.55}

/* Expandable */
details{margin-bottom:.85rem}
details summary{
  cursor:pointer;font-weight:600;font-size:.9rem;padding:.6rem 0;
  list-style:none;display:flex;align-items:center;gap:.4rem;
}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"";display:inline-block;width:0;height:0;border-left:5px solid #888;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .2s}
details[open] summary::before{transform:rotate(90deg)}

/* Algorithm section */
.algo-section{
  max-width:640px;margin:1.5rem auto 0;padding:0 1rem;
}
.algo-section .card{border-left-color:#b8a88a}
.algo-section h2{font-size:1.05rem;margin-bottom:.5rem}
.algo-section h4{font-size:.88rem;margin:.6rem 0 .2rem;color:#3d5a80}
.algo-section ol{padding-left:1.2rem;margin:.3rem 0}
.algo-section ol li{font-size:.86rem;color:#444;padding:.2rem 0}
.algo-questions{margin-top:.75rem;padding-top:.5rem;border-top:1px solid #f0ede6}
.algo-questions li{font-size:.85rem;color:#555}

/* Empty state */
.empty{text-align:center;padding:2rem 1rem;color:#aaa;font-size:.88rem;line-height:1.6}

/* Pair sub-cards inside triple view */
.sub-card{
  background:#faf9f6;border-radius:6px;padding:.85rem;margin-bottom:.6rem;
  border-left:3px solid #d8d4cc;
}
.sub-card h4{font-size:.85rem;margin-bottom:.25rem}
.sub-card p{font-size:.84rem;color:#444}

@media(min-width:768px){
  header h1{font-size:1.7rem}
  .film-graph{max-width:480px}
  .card{padding:1.4rem}
}
</style>
</head>

  prompt:'All three films are fundamentally about education\u2014what it is, who it\u2019s for, and what it could be. The Mask You Live In argues education fails boys emotionally. Oyler argues education fails poor communities structurally. Precious Knowledge argues education fails culturally diverse students intellectually. What would a school look like that addressed all three failures simultaneously?'
},
'mask+oyler+teach_us_all':{
  prompt:'These three films reveal the enormous amount of emotional, physical, and psychological labor students must perform before they can even begin to "learn." What non-academic burdens do the students in each film carry? How do the films challenge the assumption that school is a level playing field?'
},
'mask+precious_knowledge+teach_us_all':{
  prompt:'Each film deals with how dominant culture defines who a young person should be. Boys should be tough. Latinx students should assimilate. Black and Brown students should be grateful for whatever they get. How does each film show young people talking back to these definitions? What forms does resistance take?'
},
'oyler+precious_knowledge+teach_us_all':{
  prompt:'These three films are the most explicitly about schools as political spaces. In each case, the school is where larger societal battles play out: poverty, cultural erasure, segregation. If you were designing a school that honored the lessons of all three films, what would it look like? What would it not do?'
}
};

// ─── ALGORITHM ───
const ALGORITHM = {
  patterns:[
    {name:'The Hook',desc:'How do these films begin? Do they open with statistics, or with a person? Think about Ehrmann\u2019s basement, Hockenberry\u2019s neighborhood, the Little Rock mobs, the prison numbers. Why might a filmmaker choose to ground a systemic argument in one person\u2019s pain first? What does that do to you as a viewer?'},
    {name:'The Cut',desc:'Notice the rhythm of who\u2019s talking. Do the films let one person speak for long, or do they alternate between present-day interviews and archival footage? When you see a scholar make a claim and then immediately see old news footage that seems to confirm it, how does that feel different than just hearing the claim? What work is the archival footage doing?'},
    {name:'The Score',desc:'When did you notice the music? Hip-hop lyrics in 13th seem to comment directly on the argument. Folk and protest songs in Crip Camp place the disability movement inside a larger counterculture. Emotive ballads in Teach Us All rise during moments of loss. Is the music telling you what to feel before you\u2019ve decided for yourself? Is that a problem?'},
    {name:'The Antagonist',desc:'At some point, each film seems to narrow its focus from a broad social problem to something more specific\u2014a policy, an organization, a person, a cultural norm. Is there a "villain" in each film, or is it more complicated than that? Think about ALEC, Tom Horne, the state\u2019s accountability model, the "man box." Are these villains, or symptoms? Does the film want you to be angry at a person or at a system?'},
    {name:'The Climax',desc:'How do these films end? Do they resolve, or do they leave you unsettled? Think about the 504 sit-in, the student run to Phoenix, graduation day at Oyler, the mask workshop. Are these victories? Partial victories? And what does the filmmaker gain by ending on a moment of collective action rather than, say, a statistic about what happened next?'}
  ],
  questions:[
    'Does recognizing these patterns make the films less powerful, or does it help you understand how they\u2019re working on you?',
    'Is there something manipulative about these techniques? Or is "manipulation" just what we call persuasion once we\u2019ve become conscious of it?',
    'Did any of the films break the pattern? What was the effect when they did?',
    'What would a documentary about social justice look like that didn\u2019t follow this structure at all?'
  ]
};

// ─── STATE ───
const filmOrder = ['thirteenth','teach_us_all','precious_knowledge','oyler','mask','crip_camp'];
let selected = new Set();

// ─── SVG RENDERING ───
function initGraph(){
  const svg = document.querySelector('.film-graph');
  const edgesG = document.getElementById('edges');
  const nodesG = document.getElementById('nodes');

  // Draw potential edges (all 15 pairs)
  for(let i=0;i<filmOrder.length;i++){
    for(let j=i+1;j<filmOrder.length;j++){
      const a=FILMS[filmOrder[i]], b=FILMS[filmOrder[j]];
      const key=[filmOrder[i],filmOrder[j]].sort().join('+');
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',a.pos.x);line.setAttribute('y1',a.pos.y);
      line.setAttribute('x2',b.pos.x);line.setAttribute('y2',b.pos.y);
      line.setAttribute('data-key',key);
      line.classList.add('edge');
      edgesG.appendChild(line);
    }
  }

  // Draw nodes
  filmOrder.forEach(fid=>{
    const f=FILMS[fid];
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.classList.add('node');
    g.setAttribute('data-film',fid);
    g.style.setProperty('--c',f.color);

    // Invisible large tap target
    const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
    bg.setAttribute('cx',f.pos.x);bg.setAttribute('cy',f.pos.y);bg.setAttribute('r',38);
    bg.classList.add('bg');
    g.appendChild(bg);

    // Visible circle
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',f.pos.x);c.setAttribute('cy',f.pos.y);c.setAttribute('r',28);
    c.setAttribute('stroke',f.color);c.classList.add('vis');
    g.appendChild(c);

    // Label inside circle (short)
    if(f.svgLabel.length===1){
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',f.pos.x);t.setAttribute('y',f.pos.y+4);
      t.classList.add('label');t.textContent=f.svgLabel[0];
      g.appendChild(t);
    } else {
      f.svgLabel.forEach((line,i)=>{
        const t=document.createElementNS('http://www.w3.org/2000/svg','text');
        t.setAttribute('x',f.pos.x);
        t.setAttribute('y',f.pos.y - 4 + i*13);
        t.classList.add('label');
        t.style.fontSize='9px';
        t.textContent=line;
        g.appendChild(t);
      });
    }

    g.addEventListener('click',()=>toggleFilm(fid));
    nodesG.appendChild(g);
  });
}

function updateGraph(){
  // Update nodes
  document.querySelectorAll('.node').forEach(n=>{
    n.classList.toggle('selected',selected.has(n.getAttribute('data-film')));
  });
  // Update edges
  document.querySelectorAll('.edge').forEach(e=>{
    const parts=e.getAttribute('data-key').split('+');
    e.classList.toggle('active',parts.every(p=>selected.has(p)));
  });
}

// ─── INTERACTION ───
function toggleFilm(fid){
  if(selected.has(fid)){
    selected.delete(fid);
  } else if(selected.size<3){
    selected.add(fid);
  }
  update();
}
function clearAll(){
  selected.clear();
  update();
}
function update(){
  updateGraph();
  updateStatus();
  updatePhase();
  renderContent();
}

function updateStatus(){
  const el=document.getElementById('status');
  const btn=document.getElementById('clearBtn');
  if(selected.size===0){
    el.textContent='Tap the films you watched';
    btn.classList.remove('show');
  } else {
    const names=[...selected].map(id=>FILMS[id].name);
    el.textContent=names.join(' \u00B7 ');
    btn.classList.add('show');
  }
}
function updatePhase(){
  document.getElementById('ph1').classList.toggle('active',selected.size>=1);
  document.getElementById('ph2').classList.toggle('active',selected.size>=2);
  document.getElementById('ph3').classList.toggle('active',selected.size>=3);
}

// ─── CONTENT RENDERING ───
function renderContent(){
  const el=document.getElementById('content');
  const algoEl=document.getElementById('algo');

  if(selected.size===0){
    el.innerHTML=`
      <div class="empty">
        <p>Select one, two, or three films above.</p>
        <p style="margin-top:.5rem">As you select films, discussion prompts will appear here for each phase of our activity.</p>
      </div>`;
    renderAlgorithm(algoEl);
    return;
  }

  let html='';
  const ids=[...selected].sort();

  // ── TRIPLE PROMPT (top, prominent) ──
  if(ids.length===3){
    const tKey=ids.join('+');
    const t=TRIPLES[tKey];
    if(t){
      const names=ids.map(id=>FILMS[id].name).join(', ');
      html+=`<div class="card" style="--accent:#3d5a80;border-left-width:5px">
        <div class="theme">Your Synthesis Prompt</div>
        <h3>${names}</h3>
        <p>${t.prompt}</p>
      </div>`;
    }

    // Show the 3 pair prompts
    html+=`<details open><summary>Your Three Pair Connections</summary><div style="margin-top:.5rem">`;
    for(let i=0;i<ids.length;i++){
      for(let j=i+1;j<ids.length;j++){
        const pKey=[ids[i],ids[j]].sort().join('+');
        const p=PAIRS[pKey];
        if(p){
          html+=`<div class="sub-card">
            <h4>${FILMS[ids[i]].name} + ${FILMS[ids[j]].name}</h4>
            <div class="theme" style="margin-bottom:.2rem">${p.theme}</div>
            <p>${p.prompt}</p>
            <div class="readings"><h4>Readings</h4><p>${p.readings}</p></div>
          </div>`;
        }
      }
    }
    html+=`</div></details>`;
  }

  // ── PAIR PROMPT (if exactly 2) ──
  if(ids.length===2){
    const pKey=ids.join('+');
    const p=PAIRS[pKey];
    if(p){
      html+=`<div class="card" style="--accent:#6b4f8a;border-left-width:5px">
        <div class="theme">${p.theme}</div>
        <h3>${FILMS[ids[0]].name} + ${FILMS[ids[1]].name}</h3>
        <p>${p.prompt}</p>
        <div class="readings"><h4>Readings that bridge both films</h4><p>${p.readings}</p></div>
      </div>`;
    }
  }

  // ── INDIVIDUAL FILM CARDS ──
  const detailsOpen = ids.length===1 ? ' open' : '';
  html+=`<details${detailsOpen}><summary>Film Details & Individual Questions</summary><div style="margin-top:.5rem">`;
  ids.forEach(fid=>{
    const f=FILMS[fid];
    html+=`<div class="card" style="--accent:${f.color}">
      <h3>${f.name}</h3>
      <p class="synopsis">${f.synopsis}</p>
      <blockquote>"${f.quote.text}"<span class="attr">\u2014 ${f.quote.by}</span></blockquote>
      <ul>${f.questions.map(q=>`<li>${q}</li>`).join('')}</ul>
      <div class="readings"><h4>Connected Readings</h4><p>${f.readings}</p></div>
    </div>`;
  });
  html+=`</div></details>`;

  el.innerHTML=html;
  renderAlgorithm(algoEl);
}

function renderAlgorithm(el){
  el.innerHTML=`
    <details>
      <summary style="font-size:1rem">The Documentary Algorithm</summary>
      <div class="card" style="--accent:#b8a88a;margin-top:.5rem">
        <p style="margin-bottom:.6rem">These films share a formula. Here are the structural patterns they have in common:</p>
        <ol>
          ${ALGORITHM.patterns.map(p=>`<li><strong>${p.name}:</strong> ${p.desc}</li>`).join('')}
        </ol>
        <div class="algo-questions">
          <h4 style="font-size:.8rem;color:#888;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.3rem">Discussion</h4>
          <ul style="list-style:none;padding:0">
            ${ALGORITHM.questions.map(q=>`<li style="padding:.35rem 0;border-bottom:1px solid #f0ede6;font-size:.85rem;color:#555">${q}</li>`).join('')}
          </ul>
        </div>
      </div>
    </details>`;
}

// ─── INIT ───
initGraph();
update();
</script>
</body>
</html>
